version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    ignore:
      # From 0.0.45 convex-test keeps its state in Node's AsyncLocalStorage, which browsers do not have; the in-browser
      # demo (src/demo) runs on convex-test, so it stays on 0.0.35 until the demo has another engine.
      - dependency-name: convex-test
      # Node's types follow the Node version CI and production run (24): a newer major describes APIs that are not there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vite 8 breaks convex-test 0.0.35's module loading in the unit tests; it moves together with convex-test.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) cannot be loaded yet by typescript-eslint, which eslint-config-next uses.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint 10 is not yet supported by eslint-plugin-react (peer eslint ^9.7), which eslint-config-next pulls in.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive together, one PR a week; majors stay separate so they are reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze must move together: a PR that bumps only one of them fails the CodeQL job.
      codeql:
        patterns: ["github/codeql-action*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action*"]
