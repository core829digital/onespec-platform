name: Notify status page on deploy

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: POST deploy event to status.onespec.eu
        env:
          STATUS_PAGE_SITE_URL: ${{ vars.STATUS_PAGE_SITE_URL }}
          STATUS_ADMIN_TOKEN: ${{ secrets.STATUS_ADMIN_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$STATUS_PAGE_SITE_URL" ] || [ -z "$STATUS_ADMIN_TOKEN" ]; then
            echo "STATUS_PAGE_SITE_URL or STATUS_ADMIN_TOKEN not configured, skipping notify."
            exit 0
          fi
          curl -sS -X POST "$STATUS_PAGE_SITE_URL/api/deploy" \
            -H "Authorization: Bearer $STATUS_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"commitSha\":\"${{ github.sha }}\",\"commitMessage\":$(jq -Rs . <<< "$COMMIT_MESSAGE")}"
