name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref (fewer runs, fewer emails).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://placeholder.convex.cloud"

  # The browser end-to-end suites (widget in an iframe, signature, logged-in platform, demo, phone layout, every public page in
  # Chromium / Firefox / WebKit) run side by side in .github/workflows/frontend-e2e.yml.

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Known vulnerabilities in what ships (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Registry signatures and provenance of installed packages (supply chain)
        run: |
          npm ci --ignore-scripts
          npm audit signatures
