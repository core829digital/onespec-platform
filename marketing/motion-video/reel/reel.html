<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>onespec reel</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg:#0a0b0d; --text:#f5f5f7; --text-2:#9a9aa0; --mint:#16d19d; --emerald:#2d7d46; --border:#34383c; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: var(--text); }
  .abs { position: absolute; left: 0; top: 0; }
  #bg, #vignette, #grain, #black { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  #grain { opacity: 0.05; background-size: 256px 256px; }
  #black { background: #000; }
  .kicker { font: 600 26px/1 "Inter", sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--mint); white-space: nowrap; }
  .display { font-family: "Fraunces", serif; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .device { position: absolute; left: 0; top: 0; background: #050607; border: 2px solid #2a2d31; box-shadow: 0 50px 140px rgba(0,0,0,0.6), inset 0 0 0 10px #111316; overflow: hidden; transform-origin: 50% 50%; }
  .screen { position: absolute; overflow: hidden; background: #0a0b0d; }
  .screen img.page { position: absolute; left: 0; top: 0; }
  .touch { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(245,245,247,0.28); border: 3px solid rgba(245,245,247,0.75); }
  .bubble { position: absolute; max-width: 800px; padding: 26px 32px; border-radius: 34px; font: 500 38px/1.32 "Inter", sans-serif; }
  .bubble.l { left: 150px; background: #1e2023; color: var(--text); border-top-left-radius: 10px; }
  .bubble.m { right: 150px; background: #0e3a2f; color: var(--text); border: 2px solid rgba(22,209,157,0.55); border-top-right-radius: 10px; }
  .who { position: absolute; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 38px "Inter"; }
  .who.l { left: 36px; background: #2b2e33; color: #f5f5f7; }
  .who.m { right: 36px; background: var(--mint); color: #04150f; }
  .role { position: absolute; font: 600 22px "Inter"; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
  .notif { position: absolute; left: 34px; width: 772px; border-radius: 34px; background: rgba(40,43,48,0.92); padding: 22px 26px; box-sizing: border-box; }
  .wa { background: #0b141a; }
</style>
</head>

"use strict";
const DUR = 90, ZETA = 0.88;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
function spring(tau, w, z = ZETA) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z / Math.sqrt(1 - z * z)) * Math.sin(wd * tau));
}
function step4(tau, w) { if (tau <= 0) return 0; const x = w * tau; return 1 - Math.exp(-x) * (1 + x + x * x / 2 + x * x * x / 6); }
function K(v0, keys, w = 12, fn = spring) {

  return (t) => { let v = v0; for (const s of st) v += s.d * fn(t - s.t, s.w); return v; };

{

/** Show one page image per time slot; the incoming one dissolves in over ~60 ms (a UI update). */

  D.imgs.forEach((im, i) => {
    let o = i === cur ? (tc < 0 ? 1 : clamp(spring(t - tc, 55, 0.95))) : (i === prev ? 1 : 0);

    im.style.transform = `translateY(${(-scrollY * D.S).toFixed(2)}px)`;

}
function placeDevice(D, t, { x, y, s, enter, exit, dy0 = 1100, rot = 0 }) {
  const e = clamp(enter(t)), q = clamp(exit(t)), v = e * (1 - q);

}
function tap(D, t, taps, pos, scroll) {

  D.touch.style.transform = `translate(${px * D.S}px, ${(py - scroll) * D.S}px) scale(${sc.toFixed(3)})`;
}

    const k = t - WA_TAP, tv = k > -0.12 && k < 0.45 ? clamp(k < 0 ? (k + 0.12) / 0.12 : 1 - k / 0.45) : 0;
    WA.touch.style.opacity = tv.toFixed(3); WA.touch.style.visibility = tv < 0.01 ? "hidden" : "visible";
    WA.touch.style.transform = `translate(300px, 210px) scale(${(1 + Math.max(0, k) * 1.2).toFixed(3)})`;
  }
  // pipeline
  {
    const e = clamp(kanEnter(t)), q = clamp(kanExit(t)), v = e * (1 - q);
    kan.style.opacity = v.toFixed(4); kan.style.visibility = v < 0.002 ? "hidden" : "visible";
    kan.style.filter = v < 0.999 ? `blur(${((1 - v) * 10).toFixed(2)}px)` : "none";
    kan.style.transform = `translate(${540 - (KW + 36) / 2}px, ${1100 - (KH + 36) / 2 + (1 - e) * 900 - q * 160}px) perspective(2600px) rotateX(${((1 - e) * 20).toFixed(2)}deg) scale(${(0.9 + 0.1 * e).toFixed(4)})`;
    let cur = 0, tc = -1, prev = 0;
    KAN_T.forEach((kt, i) => { if (t >= kt) { prev = cur; cur = i + 1; tc = kt; } });
    kanImgs.forEach((im, i) => { const o = i === cur ? (tc < 0 ? 1 : clamp(spring(t - tc, 55, 0.95))) : (i === prev ? 1 : 0); im.style.opacity = o.toFixed(3); im.style.visibility = o < 0.002 ? "hidden" : "visible"; });
    let tv = 0, sc = 1; for (const kt of KAN_T) { const k = t - kt; if (k > -0.12 && k < 0.45) { tv = clamp(k < 0 ? (k + 0.12) / 0.12 : 1 - k / 0.45); sc = 1 + Math.max(0, k) * 1.2; } }
    kanTouch.style.opacity = tv.toFixed(3); kanTouch.style.visibility = tv < 0.01 ? "hidden" : "visible";
    kanTouch.style.transform = `translate(${110 * 1.5}px, ${128 * 1.5}px) scale(${sc.toFixed(3)})`;
  }

  const ep = endP(t);
  endWrap.style.clipPath = `inset(0 ${((1 - clamp(ep)) * 100).toFixed(3)}% 0 0)`;
  endWrap.style.opacity = clamp(ep * 1.4).toFixed(4);
  endWrap.style.filter = `blur(${((1 - clamp(ep)) * 8).toFixed(2)}px)`;
  endWrap.style.transform = `scale(${(1.05 - 0.05 * clamp(ep)).toFixed(4)})`;
  return { t };
}

window.seek = seek;
window.SOUNDS = SOUNDS;
window.FILM = { DUR };
window.READY = false;
for (const i of imgs) {
  if (!i.complete) await new Promise((r, j) => { i.onload = r; i.onerror = j; });
  for (let k = 0; k < 3; k++) { try { await i.decode(); break; } catch (e) { await new Promise((r) => setTimeout(r, 200)); } }
  if (!i.naturalWidth) throw new Error("image failed: " + i.src);
}
await document.fonts.ready;
await Promise.all(['600 40px "Fraunces"', '400 40px "Fraunces"', '400 20px "Inter"', '600 20px "Inter"', '500 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f)));
window.FONTS_OK = document.fonts.check('600 40px "Fraunces"') && document.fonts.check('400 20px "Inter"');
layoutBubbles();
seek(0);
window.READY = true;
})();
</script>
