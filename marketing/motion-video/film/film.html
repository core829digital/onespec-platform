  :root {

  #black { background: #000; }

  .body { font-family: "Inter", sans-serif; color: var(--text-2); }

            box-shadow: 0 40px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4); overflow: hidden; transform-origin: 50% 50%; }
  .bar { position: absolute; left: 0; top: 0; right: 0; background: #121416; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .dot { position: absolute; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: #2a2d31; }
  .url { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 24px; padding: 0 16px; border-radius: 8px;
         background: #1a1c1f; color: var(--text-2); font: 500 13px/24px "Inter", sans-serif; white-space: nowrap; }
  .screen { position: absolute; left: 0; overflow: hidden; }
  .screen img { position: absolute; left: 0; top: 0; }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; transform-origin: 3px 2px; }
  .card { position: absolute; border-radius: 18px; background: rgba(20,22,24,0.72); border: 1px solid rgba(255,255,255,0.08); }

          background: rgba(22,209,157,0.08); color: var(--text); font: 500 17px/1 "Inter", sans-serif; white-space: nowrap; }

(async () => {
"use strict";
const DUR = 60, BEAT = 0.5, ZETA = 0.88;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
function spring(tau, w, z = ZETA) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z / Math.sqrt(1 - z * z)) * Math.sin(wd * tau));
}
function step4(tau, w) { if (tau <= 0) return 0; const x = w * tau; return 1 - Math.exp(-x) * (1 + x + x * x / 2 + x * x * x / 6); }
/** Non-looping track: v0 plus a sum of closed-form step responses. keys: [[t, v, w?], ...] */
function K(v0, keys, w = 12, fn = spring) {
  let prev = v0; const st = keys.map(([t, v, ww]) => { const d = v - prev; prev = v; return { t, d, w: ww ?? w }; });
  return (t) => { let v = v0; for (const s of st) v += s.d * fn(t - s.t, s.w); return v; };
}
/** Visibility of a layer: enter at te (~70 ms after the move that carries it), faster exit at tx. */
function vis(t, te, tx, wi = 14, wo = 26) {
  return clamp(spring(t - te, wi, 0.92)) * (1 - clamp(spring(t - tx, wo, 0.92)));
}

// ------------------------------------------------------------ assets
const icons = await (await fetch("assets/icons.json")).json();
const meta = await (await fetch("shots/meta.json")).json();
const scene = document.getElementById("scene");
const layers = [];
function el(tag, cls, style = {}, parent = scene, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.assign(e.style, style);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
/** Text/icon layer with blur-in, lift and scale 0.965 → 1. */
function layer(e, te, tx, opt = {}) { layers.push({ e, te, tx, lift: opt.lift ?? 22, wi: opt.wi ?? 14, origin: opt.origin }); e.style.willChange = "auto"; return e; }
function icon(name, size, color) {
  const n = icons[name];
  const inner = n.map(([tag, a]) => `<${tag} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
const imgs = [];
function img(src, parent, w, h) {
  const i = el("img", null, { width: w + "px", height: h + "px" }, parent);
  i.src = src; imgs.push(i); return i;
}

// ------------------------------------------------------------ background: dimmed onespec gradient
const bgEl = document.getElementById("bg");
const bgIn = K(0, [[0.05, 1, 3.2], [58.6, 0.0, 3.0]]);
function drawBg(t) {
  const a = bgIn(t);
  const p1x = 22 + 8 * Math.sin(t * 0.11), p1y = 18 + 6 * Math.cos(t * 0.09);
  const p2x = 82 + 7 * Math.cos(t * 0.08), p2y = 86 + 5 * Math.sin(t * 0.12);
  const p3x = 62 + 10 * Math.sin(t * 0.06 + 1), p3y = 30 + 8 * Math.cos(t * 0.07);
  bgEl.style.background = [
    `radial-gradient(900px 620px at ${p1x}% ${p1y}%, rgba(22,209,157,${(0.13 * a).toFixed(3)}), transparent 70%)`,
    `radial-gradient(1100px 760px at ${p2x}% ${p2y}%, rgba(45,125,70,${(0.16 * a).toFixed(3)}), transparent 70%)`,
    `radial-gradient(800px 600px at ${p3x}% ${p3y}%, rgba(4,36,27,${(0.55 * a).toFixed(3)}), transparent 72%)`,
    `linear-gradient(160deg, #0b0e10 0%, #0a0b0d 55%, #090c0b 100%)`,
  ].join(",");
}
// film grain (seeded, deterministic per frame)
{
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), d = g.createImageData(256, 256);
  let s = 829; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rnd() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
}
const grainEl = document.getElementById("grain");
// In the final render the grain is added by ffmpeg (noise filter, after tmix) so frames stay compressible.
if (new URLSearchParams(location.search).has("nograin")) grainEl.style.display = "none";
const blackEl = document.getElementById("black");
const blackA = K(1, [[0.0, 0, 5], [59.1, 1, 5]]);

img("assets/onespec-logo.png", logoWrap, LOGO_W, LOGO_H);

function device({ cssW, cssH, k, bar, url, shots }) {
  const Dw = cssW * k, Dh = bar + cssH * k;

  if (url) el("div", "url", {}, b, url);
  const sc = el("div", "screen", { top: bar + "px", width: Dw + "px", height: cssH * k + "px" }, d);
  const layersImg = shots.map((s) => img(`shots/${s}.png`, sc, Dw, cssH * k));
  const sprite = el("div", "abs", { overflow: "hidden", borderRadius: "10px", boxShadow: "0 18px 50px rgba(0,0,0,0.6)", visibility: "hidden" }, sc);
  const cur = el("div", "cursor", {}, sc,
    `<svg viewBox="0 0 34 34" width="30" height="30"><path d="M3 2 L3 27 L9.2 21.4 L13.4 31 L17.8 29.1 L13.7 19.6 L22 19.6 Z" fill="#f5f5f7" stroke="#0a0b0d" stroke-width="2" stroke-linejoin="round"/></svg>`);
  return { d, sc, imgs: layersImg, shots, sprite, cur, Dw, Dh, k, bar, cssW, cssH };
}

};

  layer(c, 47.57 + (i % 3) * 0.12 + row * 0.5, 53.5 + i * 0.02, { lift: 26 });
});
const langRow = el("div", "abs", { left: "160px", top: "905px", display: "flex", gap: "44px", alignItems: "center", font: "500 22px Inter", color: "var(--text-2)", whiteSpace: "nowrap" });
langRow.innerHTML = `<span style="display:flex;align-items:center;gap:12px">${icon("globe", 26, "#16d19d")}<span><b style="color:var(--text);font-weight:600">6 mercati</b> · IT · FR · BE · NL · DE · LU</span></span>
  <span style="display:flex;align-items:center;gap:12px">${icon("languages", 26, "#16d19d")}<span><b style="color:var(--text);font-weight:600">6 lingue</b> · Italiano · English · Français · Deutsch · Nederlands · Română</span></span>`;
layer(langRow, 49.57, 53.55);

// ------------------------------------------------------------ S9 · end card (54 – 60 s)
const END_W = 640, END_H = END_W * 700 / 2000;
const endWrap = el("div", "abs", { left: (960 - END_W / 2) + "px", top: (400 - END_H / 2) + "px", width: END_W + "px", height: END_H + "px" });
img("assets/onespec-logo.png", endWrap, END_W, END_H);
const endP = (t) => spring(t - 54.3, 4.6, 0.96);
layer(el("div", "display abs", { left: "960px", top: "590px", fontSize: "40px", fontWeight: 400 }, scene, "Il configuratore di infissi per il tuo sito"), 55.07, 99).dataset.center = "1";
layer(el("div", "abs", { left: "960px", top: "680px", font: "500 24px Inter", letterSpacing: "0.32em", color: "var(--text-2)", whiteSpace: "nowrap" }, scene, "ONESPEC.EU"), 55.6, 99).dataset.center = "1";

// ------------------------------------------------------------ sounds
const SOUNDS = [];
for (const t of [14.0, 15.0, 16.0, 21.0, 29.0, 33.5, 38.5, 40.5, 41.5, 42.5, 43.5, 44.5]) SOUNDS.push({ t, type: "click" });
for (const [d, u] of [[16.92, 17.5], [18.42, 19.0], DRAG]) { SOUNDS.push({ t: d, type: "press" }); SOUNDS.push({ t: u, type: "release" }); }
SOUNDS.sort((a, b) => a.t - b.t);
const CLICKS = SOUNDS.filter((s) => s.type === "click").map((s) => s.t);
const HOLDS = [[16.92, 17.5], [18.42, 19.0], DRAG];
const pressSteps = [];
for (const c of CLICKS) pressSteps.push([c - 0.08, 1, 40], [c, 0, 30]);
for (const [d, u] of HOLDS) pressSteps.push([d, 1, 40], [u, 0, 30]);
pressSteps.sort((a, b) => a[0] - b[0]);
const press = K(0, pressSteps);

// ------------------------------------------------------------ seek
function placeDevice(D, cam, enter, exit, t, dx0, dy0, extra) {
  const S = cam.s(t);
  const pdx = cam.px(t) * D.k, pdy = D.bar + cam.py(t) * D.k;
  const cx = D.Dw / 2, cy = D.Dh / 2;
  const X = cam.qx(t) - cx - S * (pdx - cx), Y = cam.qy(t) - cy - S * (pdy - cy);
  const e = enter(t), x = exit(t);
  const v = clamp(e) * (1 - clamp(x));
  const ty = (1 - e) * dy0 - x * 90, tx = (1 - e) * dx0;
  const rx = (1 - e) * extra.rx0 + x * 8, ry = (1 - e) * extra.ry0;
  D.d.style.opacity = v.toFixed(4);
  D.d.style.visibility = v < 0.002 ? "hidden" : "visible";
  D.d.style.filter = v < 0.999 ? `blur(${((1 - v) * 10).toFixed(2)}px)` : "none";
  D.d.style.transform = `translate(${X + tx}px, ${Y + ty}px) perspective(2400px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${S * (0.92 + 0.08 * e) * (1 - 0.06 * x)})`;
}
function showShots(D, list, t, shift) {
  let cur = 0, tc = -1;
  for (const [ts, i] of list) if (t >= ts) { cur = i; tc = ts; }
  let prev = 0; for (const [ts, i] of list) if (ts < tc) prev = i;
  D.imgs.forEach((im, i) => {
    let o = 0;
    if (i === cur) o = clamp(spring(t - tc, 55, 0.95));
    if (i === prev && i !== cur) o = 1;
    if (tc < 0 && i === 0) o = 1;
    im.style.opacity = o.toFixed(4);
    im.style.visibility = o < 0.002 ? "hidden" : "visible";
    im.style.transform = shift ? shift(i, t) : "none";
  });
}
function seek(t) {
  drawBg(t);
  blackEl.style.opacity = clamp(blackA(t)).toFixed(4);
  const f = Math.floor(t * 24);
  grainEl.style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`;

  // logo intro
  const lp = logoP(t), lo = logoOut(t);
  logoWrap.style.clipPath = `inset(0 ${((1 - clamp(lp)) * 100).toFixed(3)}% 0 0)`;
  logoWrap.style.opacity = (clamp(lp * 1.4) * (1 - lo)).toFixed(4);
  logoWrap.style.filter = `blur(${((1 - clamp(lp)) * 8 + lo * 10).toFixed(2)}px)`;
  logoWrap.style.transform = `translateY(${-lo * 40}px) scale(${(1.05 - 0.05 * clamp(lp)) * (1 - 0.04 * lo)})`;
  logoWrap.style.visibility = lo > 0.998 ? "hidden" : "visible";
  const ep = endP(t);
  endWrap.style.clipPath = `inset(0 ${((1 - clamp(ep)) * 100).toFixed(3)}% 0 0)`;
  endWrap.style.opacity = clamp(ep * 1.4).toFixed(4);
  endWrap.style.filter = `blur(${((1 - clamp(ep)) * 8).toFixed(2)}px)`;
  endWrap.style.transform = `scale(${1.05 - 0.05 * clamp(ep)})`;

  for (const L of layers) {
    const v = vis(t, L.te, L.tx, L.wi);
    const e = L.e;
    e.style.opacity = v.toFixed(4);
    e.style.visibility = v < 0.002 ? "hidden" : "visible";
    e.style.filter = v < 0.995 ? `blur(${((1 - v) * 6).toFixed(2)}px)` : "none";
    const pre = e.dataset.center ? "translateX(-50%) " : "";
    e.style.transform = `${pre}translateY(${((1 - v) * L.lift).toFixed(2)}px) scale(${(0.965 + 0.035 * v).toFixed(4)})`;
  }

  // widget device
  placeDevice(WG, wgCam, wgEnter, wgExit, t, 0, 240, { rx0: 24, ry0: -6 });
  const sy = wgScroll(t) * WG.k;
  showShots(WG, wgShow, t, (i) => i >= 6 ? `translateY(${(W.scrollY * WG.k - sy).toFixed(2)}px)` : `translateY(${(-sy).toFixed(2)}px)`);
  // w-6/w-7 were captured scrolled; w-0..w-5 at the top — slide both so content stays aligned while scrolling
  {
    const cx = wgCur.x(t), cy = wgCur.y(t) - wgScroll(t);
    const cv = wgCurVis(t);
    WG.cur.style.opacity = cv.toFixed(3);
    WG.cur.style.visibility = cv < 0.01 ? "hidden" : "visible";
    WG.cur.style.transform = `translate(${cx * WG.k - 3}px, ${cy * WG.k - 2}px) scale(${1 - 0.14 * clamp(press(t), -0.2, 1.2)})`;
  }

  // app device
  placeDevice(AP, apCam, apEnter, apExit, t, 260, 60, { rx0: 6, ry0: -26 });
  showShots(AP, apShow, t);
  {
    const cx = apCur.x(t), cy = apCur.y(t);
    const cv = apCurVis(t);
    AP.cur.style.opacity = cv.toFixed(3);
    AP.cur.style.visibility = cv < 0.01 ? "hidden" : "visible";
    AP.cur.style.transform = `translate(${cx * AP.k - 3}px, ${cy * AP.k - 2}px) scale(${1 - 0.14 * clamp(press(t), -0.2, 1.2)})`;
    // dragged card: pure function of the cursor relative to where it grabbed
    const held = t >= DRAG[0] && t < DRAG[1];
    const sp = AP.sprite;
    if (held) {
      const gx = apCur.x(DRAG[0]), gy = apCur.y(DRAG[0]);
      const lift = clamp(spring(t - DRAG[0], 30));
      sp.style.visibility = "visible";
      sp.style.width = CARD_FROM.w * AP.k + "px"; sp.style.height = CARD_FROM.h * AP.k + "px";
      sp.style.backgroundImage = `url(shots/pipeline-0.png)`;
      sp.style.backgroundSize = `${AP.Dw}px ${AP.cssH * AP.k}px`;
      sp.style.backgroundPosition = `${-CARD_FROM.x * AP.k}px ${-CARD_FROM.y * AP.k}px`;
      sp.style.transform = `translate(${(CARD_FROM.x + cx - gx) * AP.k}px, ${(CARD_FROM.y + cy - gy) * AP.k}px) rotate(${1.5 * lift}deg) scale(${1 + 0.04 * lift})`;
    } else sp.style.visibility = "hidden";
  }
  return { t, wgCur: { x: wgCur.x(t), y: wgCur.y(t) }, apCur: { x: apCur.x(t), y: apCur.y(t) } };
}

window.seek = seek;
window.SOUNDS = SOUNDS;
window.FILM = { DUR, BEAT, beats: DUR / BEAT, scenes: { logo: 0, statement: 6, widget: WG_IN, app: AP_IN, modules: 47, end: 54 } };
window.READY = false;
seek(0);
// decode one at a time: parallel decodes of 4K PNGs can be refused by the headless browser
for (const i of imgs) {
  if (!i.complete) await new Promise((r, j) => { i.onload = r; i.onerror = j; });
  for (let k = 0; k < 3; k++) { try { await i.decode(); break; } catch (e) { await new Promise((r) => setTimeout(r, 200)); } }
  if (!i.naturalWidth) throw new Error("image failed: " + i.src);
}
await document.fonts.ready;
await Promise.all(['600 40px "Fraunces"', '400 40px "Fraunces"', '400 20px "Inter"', '600 20px "Inter"', '500 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f)));
window.FONTS_OK = document.fonts.check('600 40px "Fraunces"') && document.fonts.check('400 20px "Inter"');
seek(0);
window.READY = true;
})();
</script>
